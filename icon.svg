<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16204a"/><stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".7">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="gDn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <line x1="96" y1="160" x2="416" y2="160"/><line x1="96" y1="240" x2="416" y2="240"/><line x1="96" y1="320" x2="416" y2="320"/>
  </g>
  <!-- Gann fan from the low -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="104" y1="400" x2="408" y2="96" stroke-opacity=".55"/>
    <line x1="104" y1="400" x2="408" y2="248" stroke-opacity=".28"/>
    <line x1="104" y1="400" x2="256" y2="96" stroke-opacity=".28"/>
  </g>
  <!-- candles -->
  <g stroke-linecap="round">
    <line x1="160" y1="282" x2="160" y2="372" stroke="#4ade80" stroke-width="6"/>
    <rect x="142" y="300" width="36" height="58" rx="7" fill="url(#gUp)"/>
    <line x1="224" y1="226" x2="224" y2="334" stroke="#4ade80" stroke-width="6"/>
    <rect x="206" y="244" width="36" height="74" rx="7" fill="url(#gUp)"/>
    <line x1="288" y1="236" x2="288" y2="318" stroke="#f87171" stroke-width="6"/>
    <rect x="270" y="252" width="36" height="50" rx="7" fill="url(#gDn)"/>
    <line x1="352" y1="150" x2="352" y2="292" stroke="#4ade80" stroke-width="6"/>
    <rect x="334" y="168" width="36" height="104" rx="7" fill="url(#gUp)"/>
  </g>
  <!-- trend line with arrow -->
  <polyline points="120,352 196,276 262,300 330,196 384,150" fill="none" stroke="#070b1a" stroke-opacity=".55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="120,352 196,276 262,300 330,196 384,150" fill="none" stroke="url(#ln)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M410 124 L392 186 L356 140 Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="8" stroke-linejoin="round"/>
</svg>
